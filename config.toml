# The URL the site will be built for
base_url = "https://home.unmi.me"

title = "开源分享"

author = "langdon"

description = "分享我在用的开源项目，以及一些有趣的东西。数据自己掌握，维护成本足够低。"

default_language = "zh"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

minify_html = true

[languages.en]
title = "Open Source Picks"
description = "Sharing the open-source projects I use, and some genuinely fun stuff."

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
highlight_code = false

[extra]

[extra.site]
start_year = 2026
logo = "/img/logo.webp"
# default to use logo value
nav_logo = "/img/logo.webp"
# 联系邮箱
mail = ""
# ICP 备案号
compliance_icp = ""
# 公安备案号
compliance_security = ""
# 公安备案链接
compliance_security_link = ""


# umami 访问量统计
[extra.analytics.umami]
enable = false
# 生效的域名，避免被 localhost 统计
domain = "home.unmi.me"
# 自己的umami服务地址
remote_url = ""
# 网站id
id = ""
# js 加载地址
js = ""

# 其他设置
[extra.other]
# AVIF 图片优化，大幅降低图片尺寸
avif_enable = true

# 多语言检测提示（全局字典，渲染为内联 JS）
[extra.i18n_detect.zh]
message = "此页面也有中文版本"
action = "切换"
lang_name = "中文"
url = "/"
[extra.i18n_detect.en]
message = "This page is also available in English"
action = "Switch"
lang_name = "English"
url = "/en/"
