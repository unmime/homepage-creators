name: Sync Upstream

permissions:
  contents: write

on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: '${{ secrets.GITHUB_TOKEN }}'

      - id: check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/iWangJiaxiang/Homepage-Creators.git
          git fetch upstream main
          echo "behind=$(git rev-list --count HEAD..upstream/main)" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.behind != '0'
        run: git merge upstream/main --no-edit -m "chore: sync upstream $(date +%Y-%m-%d)"

      - if: steps.check.outputs.behind != '0'
        run: git push origin main
